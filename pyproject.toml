[project]
name = "concurso"
version = "0.1.0"
description = "Workspace do sistema local de estudo para concursos"
requires-python = ">=3.10"
dependencies = ["concurso-estudo==0.1.0", "concurso-pipeline==0.1.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "jsonschema==4.26.0", "pip-audit==2.10.1", "setuptools>=77", "wheel>=0.45"]
extract = ["concurso-pipeline[extract]==0.1.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 120
src = [".", "packages/contracts/src", "packages/pipeline/src", "packages/estudo/backend/src"]
exclude = [".qa-tools", "node_modules", ".git", ".venv", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"packages/estudo/backend/tests/*.py" = ["E402"]

