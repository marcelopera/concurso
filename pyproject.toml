[project]
name = "concurso"
version = "0.1.0"
description = "Sistema local de estudo para concursos"
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "jsonschema==4.26.0", "pip-audit==2.10.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".qa-tools", "node_modules", ".git"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"sistema-estudo/tests/*.py" = ["E402"]
"sistema-estudo/scripts/*.py" = ["E402"]

