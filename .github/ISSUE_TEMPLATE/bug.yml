name: Defeito
description: Relatar um problema reproduzível no aplicativo
body:
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Use dados fictícios; omita bancos, PDFs e informações pessoais.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e resultado observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sistema operacional e versão do aplicativo
