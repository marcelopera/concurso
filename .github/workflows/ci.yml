name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: python -m pip install -r sistema-estudo/requirements.txt
      - run: pnpm install --frozen-lockfile
        working-directory: sistema-estudo
      - run: pnpm run build
        working-directory: sistema-estudo
      - run: python tests/run_demo_suite.py
        working-directory: sistema-estudo
      - run: pnpm exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: sistema-estudo
      - run: pnpm run test:e2e
        if: runner.os == 'Linux'
        working-directory: sistema-estudo
      - run: git diff --exit-code
      - run: docker build -f sistema-estudo/Dockerfile .
        if: runner.os == 'Linux'
