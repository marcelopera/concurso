name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: python -m pip install -e packages/contracts -e packages/pipeline -e packages/estudo/backend -e ".[dev,extract]"
      - run: pnpm install --frozen-lockfile
        working-directory: packages/estudo/frontend
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python -m coverage erase
      - run: python -m coverage run -m unittest discover -s packages/pipeline/tests -v
      - run: python tools/check_packages.py
      - run: python -m coverage run --append packages/estudo/backend/tests/run_demo_suite.py
      - run: python -m coverage json --pretty-print -o artifacts/python-coverage/coverage.json
      - run: python tools/check_coverage.py --json artifacts/python-coverage/coverage.json --markdown artifacts/python-coverage/coverage.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage-${{ matrix.os }}
          path: artifacts/python-coverage/
          if-no-files-found: ignore
      - run: pnpm run lint
        working-directory: packages/estudo/frontend
      - run: pnpm test
        working-directory: packages/estudo/frontend
      - run: pnpm run build
        working-directory: packages/estudo/frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/estudo/frontend
      - run: pnpm run test:e2e
        working-directory: packages/estudo/frontend
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: packages/estudo/frontend/test-results/
      - run: git diff --exit-code
      - run: docker build -t concurso:test -f deploy/Dockerfile .
        if: runner.os == 'Linux'
      - run: python tools/smoke_container.py
        if: runner.os == 'Linux'
