name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: python -m pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
        working-directory: sistema-estudo
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check_repository.py
      - run: pnpm run lint
        working-directory: sistema-estudo
      - run: pnpm test
        working-directory: sistema-estudo
      - run: pnpm run build
        working-directory: sistema-estudo
      - run: python tests/run_demo_suite.py
        working-directory: sistema-estudo
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: sistema-estudo
      - run: pnpm run test:e2e
        working-directory: sistema-estudo
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: sistema-estudo/test-results/
      - run: git diff --exit-code
      - run: docker build -t concurso:test -f sistema-estudo/Dockerfile .
        if: runner.os == 'Linux'
      - run: python tools/smoke_container.py
        if: runner.os == 'Linux'
