name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit -r sistema-estudo/requirements.txt
      - run: pnpm install --frozen-lockfile
        working-directory: sistema-estudo
      - run: pnpm audit --prod --audit-level=high
        working-directory: sistema-estudo
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t concurso:scan -f sistema-estudo/Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: concurso:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan changes for secrets
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION" 2>/dev/null; then
            /tmp/gitleaks git --redact --log-opts="$BASE_REVISION..HEAD" .
          else
            /tmp/gitleaks dir --redact .
          fi
